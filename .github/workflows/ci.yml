name: CI

# Deux niveaux de vérification, volontairement séparés :
#
#   * `qualite` ne demande rien d'autre que le dépôt — style et tests unitaires,
#     dont ceux qui garantissent qu'aucune donnée identifiante ne quitte la
#     source. Il tourne en quelques secondes sur chaque poussée.
#   * `entrepot` monte ClickHouse et Metabase, rejoue la démonstration complète
#     depuis un clone nu, puis les invariants chiffrés et le cloisonnement. Le jeu de
#     données synthétique de l'épreuve est versionné : rien à fournir au runner.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  qualite:
    name: Style et tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Installer les dépendances
        run: uv sync --all-extras --dev

      - name: Vérifier le style
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Tests unitaires
        run: uv run pytest -m "not integration" -q

  dbt:
    name: Modèles dbt
    runs-on: ubuntu-latest
    # `dbt parse` compile tout le projet — Jinja, `ref()`, `source()`, macros — et
    # échoue sur une dépendance introuvable ou un cycle. C'est le contrôle qui
    # remplace la relecture de l'ordre des scripts numérotés, en quelques secondes
    # et sans monter l'entrepôt.
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3
        ports: ["8123:8123"]
        env:
          CLICKHOUSE_USER: chu_etl
          CLICKHOUSE_PASSWORD: ci_seulement_pour_le_service
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    env:
      CLICKHOUSE_ETL_PASSWORD: ci_seulement_pour_le_service
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Installer les dépendances
        run: uv sync --all-extras --dev

      - name: Compiler le projet dbt
        run: uv run dbt parse --project-dir dbt --profiles-dir dbt --target local

      - name: Contrôler la cohérence du projet dbt
        run: uv run pytest tests/test_dbt_project.py -q

  terraform:
    name: Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.5"

      - name: Format
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Validation
        # `-backend=false` : la validation n'a pas à joindre le compte de stockage
        # qui héberge l'état, et la CI n'a pas de secret Azure.
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate

  entrepot:
    name: Invariants de l'entrepôt
    runs-on: ubuntu-latest
    # C'est exactement le parcours d'un correcteur : cloner, `make demo`, vérifier.
    # Si ce job passe, le projet se lance sur une machine vierge.
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Démonstration complète depuis un clone nu
        run: make demo

      - name: Invariants et cloisonnement
        run: |
          uv run pytest -q
          uv run eds check-cloisonnement

      - name: Le planificateur local tourne et annonce son prochain passage
        run: |
          docker compose ps --status running --services | grep -qx scheduler
          docker compose logs --no-log-prefix scheduler | grep "Prochain passage"

      - name: Le même pipeline, depuis l'image du cloud, sur un entrepôt vide
        # Ce que fait le planificateur chaque nuit, joué tout de suite : l'image
        # construite depuis le Dockerfile ingère les 92 fichiers, écrit le lake et les
        # journaux sur le poste sous l'identité de l'utilisateur, et les 86 invariants
        # doivent valoir exactement pareil que par le CLI. Le `make reset` final prouve
        # que ces fichiers restent effaçables sans droits root.
        run: |
          echo y | make reset
          make up
          docker compose run --rm scheduler run
          make provision
          uv run pytest -m integration -q
          uv run eds run | grep "déjà ingéré"
          echo y | make reset

      - name: Journaux en cas d'échec
        if: failure()
        run: |
          docker compose logs --tail 200
          tail -100 logs/pipeline.log || true
