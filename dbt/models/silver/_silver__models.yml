version: 2

models:
  - name: dim_patient
    description: >
      Dimension conformée patient — pseudonymisée, une ligne par patient (dernière
      version connue). Partagée par les trois étoiles : pilotage et recherche comptent
      donc les mêmes patients.
    columns:
      - name: patient_pseudo
        description: "Pseudonyme HMAC-SHA256 tronqué à 64 bits — aucun IPP en clair"
        data_tests: [unique, not_null]
      - name: birth_year
        description: "Année de naissance : la date complète est généralisée dès la collecte"
        data_tests: [not_null]
      - name: sex
        description: "Sexe normalisé à la collecte"
        data_tests:
          - accepted_values:
              arguments:
                values: ["M", "F"]
      - name: region_code
        description: "Département de résidence"
      - name: first_seen_ingest_date
        description: "Premier jour de dépôt où ce patient est apparu"
      - name: _source_file
        description: "Fichier du lake dont provient la dernière version"
      - name: _ingest_date
        description: "Jour de dépôt de la dernière version"
      - name: _built_at
        description: "Horodatage de construction de la couche silver"

  - name: dim_service
    description: >
      Dimension conformée service hospitalier (référentiel du CHU), complétée depuis le
      29 août 2026 par sa description : catégorie, capacité en lits, pôle. Un service
      absent de la description est conservé — catégorie et pôle « (non decrit) »,
      capacité NULL, jamais inventée.
    columns:
      - name: service_code
        description: "Code du service d'hospitalisation"
        data_tests: [unique, not_null]
      - name: service_label
        description: "Libellé du service"
        data_tests: [not_null]
      - name: categorie
        description: "Type de service — regroupe plusieurs services ; « (non decrit) » si non décrit"
        data_tests: [not_null]
      - name: pole
        description: "Pôle hospitalier ; « (non decrit) » si non décrit"
        data_tests: [not_null]
      - name: capacite_lits
        description: "Nombre de lits — NULL si le service n'est pas décrit"
      - name: est_decrit
        description: "Le service figure-t-il dans le référentiel de description ?"
        data_tests: [not_null]

  - name: dim_cim10
    description: "Dimension CIM-10 : code diagnostic → libellé (nomenclature OMS)."
    columns:
      - name: code_cim10
        description: "Code diagnostic CIM-10"
        data_tests: [unique, not_null]
      - name: libelle
        description: "Libellé de la pathologie"
        data_tests: [not_null]

  - name: fact_sejour
    description: >
      Fait séjour (grain : 1 séjour) — étoile sur dim_patient et dim_service.
      Les séjours dont la sortie précède l'admission sont écartés vers sejours_rejets :
      leurs horodatages sont inexploitables. Le rejet s'arrête là — leurs diagnostics et
      leurs relevés restent dans l'entrepôt. Un séjour sans date de sortie est conservé
      (patient encore hospitalisé).
    columns:
      - name: stay_id
        description: "Identifiant du séjour — dimension dégénérée commune aux trois faits"
        data_tests: [unique, not_null]
      - name: patient_pseudo
        description: "Clé vers dim_patient"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_patient')
                field: patient_pseudo
      - name: service_code
        description: "Clé vers dim_service"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_service')
                field: service_code
      - name: admission_ts
        description: "Date et heure d'admission"
        data_tests: [not_null]
      - name: discharge_ts
        description: "Date et heure de sortie — NULL si le séjour est en cours"
      - name: admission_mode
        description: "Mode d'entrée"
        data_tests:
          - accepted_values:
              arguments:
                values: ["urgence", "programme", "mutation"]
      - name: discharge_mode
        description: "Mode de sortie — NULL si non renseigné à la source, jamais inventé"
      - name: admission_date
        description: "Jour d'admission"
      - name: discharge_date
        description: "Jour de sortie"
      - name: duree_heures
        description: "Durée du séjour en heures, à la minute près — NULL tant qu'il est en cours"
      - name: duree_jours
        description: "Durée du séjour en jours — mesure de la DMS, NULL si en cours"
      - name: is_ongoing
        description: "Séjour en cours : cas métier légitime, exclu de la DMS"
      - name: is_deces
        description: "Sortie par décès"
      - name: is_admission_urgence
        description: "Entrée en mode urgence, tous services confondus"
      - name: is_service_urgences
        description: "Séjour dans l'unité URGENCES"
      - name: is_post_mortem_anomaly
        description: "Admission postérieure à un décès du même patient — signalée, non rejetée"
      - name: _source_file
      - name: _ingest_date
      - name: _built_at

  - name: sejours_rejets
    description: >
      Séjours écartés par le contrôle de cohérence temporelle, avec le motif et le
      lignage. On n'écarte jamais en silence.
    columns:
      - name: stay_id
        data_tests: [unique, not_null]
      - name: reject_reason
        description: "Motif technique du rejet"
        data_tests: [not_null]
      - name: reject_label
        description: "Motif en clair, repris au rapport qualité"
        data_tests: [not_null]

  - name: fact_diagnostic
    description: >
      Fait diagnostic (grain : 1 code CIM-10 par séjour) — fait sans mesure, support des
      cohortes. Le patient est résolu depuis le référentiel de TOUS les séjours déposés :
      un diagnostic est un fait clinique, il ne disparaît pas parce qu'une date de sortie
      a été mal saisie.
    columns:
      - name: stay_id
        description: "Dimension dégénérée vers le séjour"
        data_tests: [not_null]
      - name: patient_pseudo
        description: "Propagé depuis le séjour : évite toute jointure fait-à-fait"
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_patient')
                field: patient_pseudo
      - name: code_cim10
        description: "Clé vers dim_cim10"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cim10')
                field: code_cim10
      - name: diag_type
        description: "Rang du diagnostic ; en cas de conflit à la source, principal l'emporte"
        data_tests:
          - accepted_values:
              arguments:
                values: ["principal", "associe"]
      - name: is_principal
        description: "Diagnostic principal du séjour — motif de l'hospitalisation"
      - name: admission_date
        description: "Jour d'admission du séjour parent (dénormalisé)"
      - name: service_code
        description: "Service du séjour parent (dénormalisé)"

  - name: fact_monitoring
    description: >
      Fait monitoring (grain : 1 relevé) — étoile sur dim_service, sans identifiant
      patient : aucun besoin métier ne l'exige, la donnée ne descend donc pas jusqu'ici.
      Un relevé porte son propre horodatage et reste valide même si le séjour parent a
      une date de sortie aberrante.
    columns:
      - name: stay_id
        description: "Dimension dégénérée vers le séjour"
        data_tests: [not_null]
      - name: service_code
        description: "Propagé depuis le séjour — permet l'agrégation par service sans jointure"
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_service')
                field: service_code
      - name: ts
        description: "Horodatage du relevé"
        data_tests: [not_null]
      - name: releve_date
        description: "Jour du relevé"
      - name: heart_rate
        description: "Fréquence cardiaque (bpm), dans la plage physiologique 20-250"
      - name: spo2
        description: "Saturation en oxygène (%), dans la plage 50-100"
      - name: temp_c
        description: "Température (°C), dans la plage 30-45"
      - name: alert_hr
        description: "Bradycardie (< 50) ou tachycardie (> 100)"
      - name: alert_spo2
        description: "Désaturation (< 92 %)"
      - name: alert_temp
        description: "Fièvre (> 38,5 °C)"
      - name: is_alert
        description: "Au moins une constante hors seuil de vigilance"
      - name: is_after_discharge
        description: >
          Relevé postérieur à la sortie — contrôle actif, attendu à 0. Évalué sur les
          seuls séjours temporellement cohérents.

  - name: monitoring_rejets
    description: >
      Relevés écartés — hors plage physiologique, ou rattachés à un séjour absent du
      dépôt. Motif conservé.
    columns:
      - name: reject_reason
        description: "Motifs cumulés, séparés par '+'"
        data_tests: [not_null]

  # ── Évolution du 29 août 2026 ─────────────────────────────────────────────
  - name: dim_ccam
    description: "Dimension CCAM : code d'acte médical → libellé et tarif T2A."
    columns:
      - name: code_ccam
        description: "Code de l'acte"
        data_tests: [unique, not_null]
      - name: libelle
        description: "Libellé de l'acte"
        data_tests: [not_null]
      - name: tarif_euros
        description: "Tarif T2A en euros — NULL si absent du référentiel"

  - name: fact_acte
    description: >
      Fait acte médical (grain : 1 acte) — étoile sur dim_service et dim_ccam. Le service
      est résolu au build depuis le référentiel des séjours et rangé sur le fait : aucune
      jointure entre tables de faits n'est jamais nécessaire. Sans identifiant patient,
      aucun indicateur d'actes n'en ayant besoin.
    columns:
      - name: stay_id
        description: "Dimension dégénérée vers le séjour"
        data_tests: [not_null]
      - name: service_code
        description: "Propagé depuis le séjour — c'est ce qui rend « actes par service » calculable sans jointure fait-à-fait"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_service')
                field: service_code
      - name: code_ccam
        description: "Clé vers dim_ccam"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_ccam')
                field: code_ccam
      - name: acte_ts
        description: "Date et heure de l'acte"
        data_tests: [not_null]
      - name: acte_date
        description: "Jour de l'acte"
      - name: montant_euros
        description: "Tarif T2A de l'acte au moment du build — NULL si le code est inconnu"
      - name: is_code_inconnu
        description: "Code absent du référentiel CCAM — contrôle actif, attendu à 0"
      - name: is_hors_sejour
        description: "Acte avant l'admission ou après la sortie — évalué sur les seuls séjours cohérents"

  - name: actes_rejets
    description: "Actes écartés : séjour absent du dépôt. Motif conservé, lignes consultables."
    columns:
      - name: reject_reason
        data_tests: [not_null]
      - name: reject_label
        data_tests: [not_null]
