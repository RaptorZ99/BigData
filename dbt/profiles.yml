# Deux cibles, un seul code.
#
#   local  — ClickHouse du docker-compose, sur le poste
#   azure  — ClickHouse de la VM, joint par son IP privée depuis le job Container Apps
#
# Aucune valeur en dur : tout vient de l'environnement, que ce soit `.env` en local
# ou les références Key Vault du job. Le mot de passe n'a donc pas de valeur par
# défaut — mieux vaut un échec explicite qu'une connexion silencieuse en anonyme.

eds:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:
    local: &clickhouse
      type: clickhouse
      driver: http
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_ETL_USER', 'chu_etl') }}"
      password: "{{ env_var('CLICKHOUSE_ETL_PASSWORD') }}"
      schema: eds_silver
      secure: false
      connect_timeout: 10
      send_receive_timeout: 300
      # Un seul thread : la VM cible n'a qu'un vCPU et 2 Gio. Paralléliser dbt n'y
      # gagnerait rien et multiplierait la pression mémoire. À passer à 4 si l'on
      # bascule sur un profil plus large (cf. docs/PLAN-CLOUD.md §10.2).
      threads: 1
    azure: *clickhouse
