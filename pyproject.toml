[project]
name = "eds-chu"
version = "1.0.0"
description = "Entrepôt de Données de Santé (EDS) du CHU — pipeline médaillon ClickHouse + Metabase"
readme = "README.md"
# dbt-core 1.11 ne démarre pas sur Python 3.14 (mashumaro : UnserializableField sur
# JSONObjectSchema.schema). La borne haute est donc une contrainte d'outillage, pas
# de langage — cf. docs/PLAN-CLOUD.md §5.6.
requires-python = ">=3.12,<3.14"
dependencies = [
    "clickhouse-connect>=0.8.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "requests>=2.32.0",
]

# Extras : le socle reste minimal pour `make demo`. Le cloud (stockage objet) et la
# transformation dbt s'ajoutent explicitement — c'est l'image du job qui les installe.
[project.optional-dependencies]
azure = [
    "azure-storage-blob>=12.23.0",
    "azure-identity>=1.19.0",
]
dbt = [
    "dbt-clickhouse>=1.10.2,<1.11",
]

[project.scripts]
eds = "eds.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: nécessite ClickHouse démarré et le pipeline exécuté (make up && make pipeline)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Projet rédigé en français : ces caractères sont de la typographie voulue,
# pas des homoglyphes accidentels.
allowed-confusables = ["×", "—", "–", "’"]
