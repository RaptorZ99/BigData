version: 2

models:
  - name: kpi_dms_service
    description: >
      KPI 1 — Durée moyenne de séjour par service. Grain : le service. Séjours terminés
      uniquement : une durée partielle tirerait la moyenne vers le bas.
    columns:
      - name: service_code
        description: "Service d'hospitalisation"
        data_tests: [unique, not_null]
      - name: nb_sejours
        description: "Séjours terminés dans ce service sur la période"
        data_tests: [not_null]
      - name: dms_jours
        description: "Durée moyenne de séjour, en jours"
        data_tests: [not_null]
      - name: dms_heures
        description: "La même durée en heures — lecture naturelle pour les séjours courts"
      - name: duree_mediane_jours
        description: "Durée médiane exacte — à lire avec la moyenne, les distributions sont asymétriques"

  - name: kpi_urgences_jour
    description: >
      KPI 3 — Activité quotidienne des urgences. Grain : le jour d'admission. Un passage
      est un séjour dont l'unité d'hospitalisation est URGENCES ; les admissions en mode
      « urgence » tous services confondus répondent à une autre question et vivent dans
      kpi_flux.
    columns:
      - name: admission_date
        data_tests: [unique, not_null]
      - name: nb_passages
        description: "Séjours admis ce jour-là dans l'unité URGENCES"
        data_tests: [not_null]
      - name: nb_encore_presents
        description: "Parmi eux, ceux dont la sortie n'est pas renseignée"
      - name: duree_moy_heures
        description: "Durée moyenne des passages terminés, en heures"

  - name: kpi_readmissions_30j
    description: >
      KPI 2 — Taux de réadmission à 30 jours, au grain de l'établissement. Table à une
      seule ligne. Borne basse : une sortie tardive ne peut pas être suivie d'une
      réadmission observable dans une fenêtre de données qui s'arrête.
    columns:
      - name: nb_sejours
        description: "Dénominateur : tous les séjours valides de la période"
        data_tests: [not_null]
      - name: nb_readmissions_30j
        description: "Séjours suivis d'une nouvelle admission du même patient sous 30 jours"
        data_tests: [not_null]
      - name: taux_readmission_30j_pct
        data_tests: [not_null]

  - name: kpi_readmissions_service
    description: >
      Ventilation par service du taux de réadmission à 30 jours. Le service porté est
      celui du séjour initial. Se réconcilie avec kpi_readmissions_30j par construction.
    columns:
      - name: service_code
        data_tests: [unique, not_null]
      - name: taux_readmission_30j_pct
        data_tests: [not_null]

  - name: kpi_alertes_jour
    description: >
      KPI 4 — Relevés de constantes en alerte, par jour, tous services confondus.
      Seuils de vigilance : FC < 50 ou > 100 bpm, SpO2 < 92 %, température > 38,5 °C.
    columns:
      - name: jour
        data_tests: [unique, not_null]
      - name: nb_releves
        data_tests: [not_null]
      - name: nb_alertes
        description: "Relevés portant au moins une constante hors seuil"
        data_tests: [not_null]
      - name: taux_alertes_pct
        description: "Part des relevés en alerte"
        data_tests: [not_null]

  - name: kpi_alertes_service
    description: >
      Ventilation par service de la surveillance des constantes. Le monitoring ne couvre
      que les services équipés de capteurs au chevet : ne pas lire l'absence des autres
      services comme une absence d'alertes.
    columns:
      - name: service_code
        data_tests: [unique, not_null]
      - name: nb_sejours_monitores
        description: "Séjours ayant au moins un relevé"

  - name: kpi_activite_service
    description: >
      Activité quotidienne par service : entrées, sorties, décès et séjours ouverts.
      Les séjours ouverts sont calculés par cumul sur un calendrier reconstruit jour par
      jour — jamais par produit croisé jour × séjour, qui devient quadratique avec
      l'historique, et jamais depuis les seuls jours porteurs d'un mouvement, qui
      trouerait la courbe.
    columns:
      - name: jour
        data_tests: [not_null]
      - name: sejours_en_cours
        description: "Séjours ouverts à la fin de la journée : la charge réelle du service"

  - name: kpi_flux
    description: "Répartition quotidienne des modes d'admission et de sortie, en format long."
    columns:
      - name: sens
        description: "admission ou sortie"
        data_tests:
          - accepted_values:
              arguments:
                values: ["admission", "sortie"]
      - name: mode
        description: "Mode d'entrée ou de sortie ; 'non renseigne' quand la source est muette"

  - name: kpi_synthese
    description: >
      Chiffres clés pour les tuiles de tête du tableau de bord. Table à une seule ligne,
      dont chaque valeur est reprise telle quelle d'une autre table gold : une tuile et
      le graphique qui la détaille ne peuvent pas diverger.
    columns:
      - name: nb_sejours
        data_tests: [not_null]
      - name: nb_patients
        description: "Patients distincts ayant au moins un séjour — mesure NON additive"
      - name: dms_globale_jours
        description: "DMS tous services confondus"
      - name: taux_readmission_pct
        description: "Repris de kpi_readmissions_30j"
      - name: pct_releves_alerte
        description: "Repris de kpi_alertes_jour"
      - name: nb_actes
        description: "Repris de kpi_actes_service"
      - name: montant_facture_euros
        description: "Repris de kpi_facturation_service"
      - name: _built_at
        description: "Horodatage de construction de gold — comparé à celui de silver pour détecter un retard"

  - name: kpi_qualite_pipeline
    description: >
      Les contrôles qualité du dernier traitement, exposés au métier : lignes lues,
      conservées, écartées (retirées) et signalées (conservées mais marquées).
    columns:
      - name: rule
        description: "Identifiant technique du contrôle"
        data_tests: [not_null]
      - name: nature
        description: "rejet, signalement ou conforme"
        data_tests:
          - accepted_values:
              arguments:
                values: ["rejet", "signalement", "conforme"]

  - name: kpi_ingestion
    description: "Traçabilité de l'ingestion : fichier source, jour de dépôt, volumétrie, statut."
    columns:
      - name: fichier_source
        data_tests: [not_null]
      - name: statut
        data_tests:
          - accepted_values:
              arguments:
                values: ["success", "failed"]

  # ── Évolution du 29 août 2026 : les cinq KPI, dans l'ordre de la consigne ──
  # Une table par indicateur, aux colonnes de la question posée. `rang` est la clé
  # de tri physique : chaque table se lit dans l'ordre du classement sans ORDER BY.
  - name: kpi_activite_categorie
    description: >
      KPI 1 (évolution) — Activité et DMS par catégorie de service, séjours clos. Grain :
      la catégorie, niveau intermédiaire de la hiérarchie service → catégorie → pôle. Le
      service non décrit apparaît sous « (non decrit) ».
    columns:
      - name: categorie
        data_tests: [unique, not_null]
      - name: nb_sejours
        description: "Séjours terminés de la catégorie"
        data_tests: [not_null]
      - name: dms_jours
        description: "Durée moyenne des séjours terminés, en jours"
        data_tests: [not_null]
      - name: rang
        description: "Classement par activité décroissante — clé de tri de la table"
        data_tests: [unique, not_null]

  - name: kpi_actes_service
    description: >
      KPI 2 (évolution) — Nombre d'actes par service et nombre moyen d'actes par séjour.
      Le service est celui du séjour, résolu sur le fait : aucune jointure fait à fait.
    columns:
      - name: service_code
        data_tests: [unique, not_null]
      - name: nb_actes
        data_tests: [not_null]
      - name: nb_sejours_avec_acte
        description: "Séjours distincts ayant au moins un acte"
        data_tests: [not_null]
      - name: actes_par_sejour
        description: "nb_actes / nb_sejours_avec_acte — NULL pour un service sans acte"
      - name: rang
        description: "Classement par nombre d'actes décroissant — clé de tri de la table"
        data_tests: [unique, not_null]

  - name: kpi_actes_type
    description: >
      KPI 3 (évolution) — Nombre d'actes par type d'acte, code et libellé CCAM, du plus
      fréquent au plus rare. Un code absent de la nomenclature resterait visible sous
      « code inconnu ».
    columns:
      - name: code_ccam
        data_tests: [unique, not_null]
      - name: libelle_ccam
        data_tests: [not_null]
      - name: nb_actes
        data_tests: [not_null]
      - name: rang
        description: "Classement par fréquence décroissante — clé de tri de la table"
        data_tests: [unique, not_null]

  - name: kpi_densite_lits
    description: >
      KPI 4 (évolution) — Densité d'actes par lit : nb_actes / capacite_lits, intensité
      du plateau technique. NULL quand la capacité est inconnue — on ne divise pas par
      un nombre de lits inventé ; le service non décrit se classe en dernier.
    columns:
      - name: service_code
        data_tests: [unique, not_null]
      - name: capacite_lits
        description: "Lits du service — NULL si le service n'est pas décrit"
      - name: nb_actes
        data_tests: [not_null]
      - name: actes_par_lit
        description: "nb_actes / capacite_lits, à une décimale — NULL sans capacité"
      - name: rang
        description: "Classement par densité décroissante, sans capacité en dernier — clé de tri"
        data_tests: [unique, not_null]

  - name: kpi_facturation_service
    description: >
      KPI 5 (évolution) — Montant facturé par service : somme des tarifs T2A des actes,
      mesure additive portée par fact_acte. Le total de l'établissement est repris dans
      kpi_synthese.
    columns:
      - name: service_code
        data_tests: [unique, not_null]
      - name: nb_actes
        data_tests: [not_null]
      - name: montant_facture_euros
        description: "Somme des tarifs T2A des actes du service, en euros"
        data_tests: [not_null]
      - name: rang
        description: "Classement par montant décroissant — clé de tri de la table"
        data_tests: [unique, not_null]
