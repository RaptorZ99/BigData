version: 2

models:
  - name: prevalence_pathologie
    description: >
      KPI 5 — Prévalence par pathologie : taille des cohortes par diagnostic CIM-10, tous
      rangs confondus. Un patient est compté une fois par pathologie. Une cohorte de
      moins de cinq patients garde sa ligne mais voit ses effectifs masqués.
    columns:
      - name: code_cim10
        data_tests: [unique, not_null]
      - name: libelle
        data_tests: [not_null]
      - name: diffusable
        description: "La cohorte atteint-elle le seuil de k patients ?"
        data_tests: [not_null]
      - name: nb_patients
        description: "Patients distincts portant ce diagnostic — mesure NON additive, NULL si masquée"
      - name: nb_sejours
        description: "Séjours portant ce diagnostic — NULL si masquée"
      - name: prevalence_pct
        description: "Part de la population suivie — NULL si masquée"
      - name: nb_patients_total
        description: "Dénominateur : population suivie par l'entrepôt"
        data_tests: [not_null]

  - name: cohorte_demographie
    description: >
      KPI 6 — Description de cohorte : distribution par âge et sexe, au grain
      pathologie × tranche d'âge × sexe. Restreinte au diagnostic PRINCIPAL, c'est-à-dire
      au motif d'hospitalisation. Âges en tranches de dix ans, jamais en valeur exacte.
      Une cellule de moins de cinq patients garde sa ligne, effectif masqué.
    columns:
      - name: code_cim10
        data_tests: [not_null]
      - name: tranche_age
        description: "Tranche de dix ans — l'âge exact n'est jamais diffusé"
        data_tests: [not_null]
      - name: sexe
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["M", "F"]
      - name: diffusable
        description: "La cellule atteint-elle le seuil de k patients ?"
        data_tests: [not_null]
      - name: nb_patients
        description: "Patients distincts de la cellule — NULL si masquée"

  - name: cohorte_demographie_globale
    description: >
      Pyramide des âges de la population suivie, au grain sexe × tranche d'âge, chaque
      patient compté une fois. C'est cette table que lit le graphique de distribution —
      pas cohorte_demographie, qui compterait cinq fois un patient à cinq diagnostics.
    columns:
      - name: sexe
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["M", "F"]
      - name: tranche_age
        description: "Tranche de dix ans — l'âge exact n'est jamais diffusé"
        data_tests: [not_null]
      - name: diffusable
        data_tests: [not_null]
      - name: nb_patients
        description: "Patients distincts de la cellule — NULL si masquée"

  - name: k_anonymat_controle
    description: >
      Preuve du dispositif, volontairement diffusable : combien de cellules ont été
      masquées et sur quel critère, sans jamais révéler lesquelles ni leur effectif.
    columns:
      - name: table_cible
        data_tests: [unique, not_null]
      - name: motif
        description: "Critère de masquage appliqué"
      - name: cellules_calculees
        description: "Cellules produites avant application du seuil"
      - name: cellules_diffusees
        description: "Cellules dont l'effectif est publié"
      - name: cellules_masquees
        description: "Cellules dont l'effectif est retiré"
      - name: seuil_k
        description: "Valeur du seuil appliqué"
