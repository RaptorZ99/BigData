version: 2

models:
  - name: cohorte_pathologie
    description: >
      Taille des cohortes par diagnostic CIM-10. Une cohorte de moins de cinq patients
      n'est pas diffusée.
    columns:
      - name: code_cim10
        data_tests: [unique, not_null]
      - name: nb_patients
        description: "Patients distincts portant ce diagnostic — mesure NON additive"
        data_tests: [not_null]
      - name: nb_patients_diag_principal
        description: "Patients pour qui ce code est le diagnostic principal"

  - name: prevalence_pathologie
    description: >
      Part des patients concernés par chaque pathologie. Dénominateur : patients
      distincts ayant au moins un séjour, calculé comme scalaire agrégé — jamais par
      jointure entre deux tables de faits.
    columns:
      - name: code_cim10
        data_tests: [unique, not_null]
      - name: prevalence_pct
        description: "Prévalence en pourcentage de la population suivie"
        data_tests: [not_null]

  - name: cohorte_demographie_globale
    description: >
      Pyramide des âges de la population suivie, au grain sexe × tranche d'âge, chaque
      patient compté une fois. C'est cette table que lit le graphique de distribution —
      pas cohorte_demographie, qui compterait cinq fois un patient à cinq diagnostics.
    columns:
      - name: sexe
        data_tests:
          - accepted_values:
              arguments:
                values: ["M", "F"]
      - name: tranche_age
        description: "Tranche de dix ans — l'âge exact n'est jamais diffusé"
      - name: nb_patients
        data_tests: [not_null]

  - name: cohorte_demographie_region
    description: >
      Grain fin diffusé : pathologie × sexe × tranche d'âge × département, pour les
      cellules atteignant le seuil.
    columns:
      - name: nb_patients
        data_tests: [not_null]

  - name: cohorte_demographie
    description: >
      Marge par pathologie, sexe et tranche d'âge. Diffusée uniquement si sa
      décomposition départementale l'est intégralement — sans quoi la cellule cachée
      se retrouverait par soustraction.
    columns:
      - name: nb_patients
        data_tests: [not_null]

  - name: k_anonymat_controle
    description: >
      Preuve du dispositif, volontairement diffusable : combien de cellules ont été
      retirées et pourquoi, sans jamais révéler lesquelles ni leur effectif.
    columns:
      - name: table_cible
        data_tests: [unique, not_null]
      - name: cellules_calculees
        description: "Cellules produites avant application du seuil"
      - name: cellules_diffusees
        description: "Cellules effectivement publiées"
      - name: cellules_supprimees
        description: "Cellules retirées par le seuil ou la suppression complémentaire"
      - name: seuil_k
        description: "Valeur du seuil appliqué"
