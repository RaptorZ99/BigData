# EDS CHU — entrepôt (ClickHouse) + restitution (Metabase).
#
# Pas de `name:` ni de `container_name:` : le nom du projet Compose dérive du dossier.
# Deux copies du dépôt sur une même machine (un clone et une archive dézippée, par
# exemple) ont ainsi chacune leurs conteneurs et leurs volumes. Avec un nom figé, la
# seconde copie s'attachait en silence à la pile de la première — et à son Metabase,
# dont le mot de passe n'était pas celui de son `.env`. Les ports restent fixes : une
# seule pile tourne à la fois, et la seconde échoue clairement sur « port already
# allocated » plutôt que d'emprunter les données de l'autre.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_ETL_USER:-chu_etl}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ETL_PASSWORD:?CLICKHOUSE_ETL_PASSWORD manquant (cp .env.example .env)}
      # Autorise chu_etl à créer les users/GRANTs de cloisonnement en SQL.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      # Le point d'entrée de l'image fait un `chown -R` sur `user_files` dès que ce
      # dossier n'appartient pas à `clickhouse`. Or il n'existe pas dans l'image :
      # c'est Docker qui le crée, comme parent du point de montage du lake, avec un
      # propriétaire qui dépend de sa version (root sur certains runners). Le chown
      # descend alors dans le lake, monté en lecture seule, et le conteneur meurt sur
      # « Read-only file system » avant même de démarrer — vu deux fois en CI.
      # L'image possède déjà tous ses répertoires : ce chown n'a rien à corriger.
      CLICKHOUSE_DO_NOT_CHOWN: "1"
    ports:
      - "8123:8123"   # HTTP : clients, UI /play
      - "9000:9000"   # protocole natif
    volumes:
      # Stockage du moteur : volume Docker nommé, jamais un dossier de l'hôte.
      # Un bind mount macOS ne garantit pas les renommages atomiques dont
      # ClickHouse a besoin (CREATE OR REPLACE TABLE échoue alors sur un
      # `filesystem error: in rename`).
      - clickhouse-data:/var/lib/clickhouse
      # Le lake, lui, reste un dossier de l'hôte : le moteur le lit via file(),
      # en lecture seule. Aucune donnée ne transite par la mémoire Python.
      - ./data/lake:/var/lib/clickhouse/user_files/lake:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  metabase:
    image: metabase/metabase:v0.58.31
    ports:
      - "3000:3000"
    environment:
      # H2 embarqué persisté : suffisant pour la démo. En production on
      # basculerait sur Postgres (cf. docs/RAPPORT.md § limites).
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: Europe/Paris
      # Metabase installe par défaut une base et un tableau de bord de
      # démonstration e-commerce. Ils ne sont visibles d'aucun des deux comptes
      # de restitution (les permissions de collection les excluent), mais ils
      # encombrent la vue d'administration d'un contenu étranger au CHU — et
      # une base de démonstration n'a rien à faire dans un entrepôt de santé.
      MB_LOAD_SAMPLE_CONTENT: "false"
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  # ── Le planificateur : jumeau local du job Azure ─────────────────────────
  # Même Dockerfile que l'image des jobs Container Apps, même commande (`eds run`),
  # même cron UTC (`5 1 * * *`), même réessai. Il vit dans le réseau de la pile et
  # joint ClickHouse par son nom de service, comme le job Azure joint la VM par son
  # adresse privée. Il écrit le lake et les journaux là où le CLI du poste les
  # écrit : les deux chemins d'exécution partagent tout, y compris `ops.ingest_log`.
  scheduler:
    build: .
    image: eds-chu:local
    command: ["schedule"]
    env_file: .env
    environment:
      # Dans le réseau Docker, ClickHouse et Metabase se joignent par leur nom de
      # service : ces deux valeurs remplacent le `localhost` du .env, écrit pour le CLI.
      CLICKHOUSE_HOST: clickhouse
      MB_URL: http://metabase:3000
      # dbt écrit un fichier d'usage sous $HOME ; l'utilisateur ci-dessous n'en a pas.
      HOME: /tmp
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    # Le lake et les journaux sont des dossiers du poste : le conteneur prend
    # l'identité de son utilisateur (écrite par `make env`), sinon ces fichiers
    # appartiendraient à root et `make reset` ne pourrait plus les effacer sur Linux.
    user: "${EDS_UID:-1000}:${EDS_GID:-1000}"
    volumes:
      - ./source-filestorage:/app/source-filestorage:ro
      - ./data/lake:/app/data/lake
      - ./logs:/app/logs
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

volumes:
  clickhouse-data:
  metabase-data:
