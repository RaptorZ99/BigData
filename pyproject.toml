[project]
name = "eds-chu"
version = "1.0.0"
description = "Entrepôt de Données de Santé (EDS) du CHU — pipeline médaillon ClickHouse + Metabase"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "clickhouse-connect>=0.8.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "requests>=2.32.0",
]

[project.scripts]
eds = "eds.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: nécessite ClickHouse démarré et le pipeline exécuté (make up && make pipeline)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Projet rédigé en français : ces caractères sont de la typographie voulue,
# pas des homoglyphes accidentels.
allowed-confusables = ["×", "—", "–", "’"]
